<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Vertical 3D Parallax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ffe55c;
      --accent-2: #ffffff;
      --text-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --panel: rgba(9, 24, 56, 0.64);
      --panel-border: rgba(255, 255, 255, 0.2);
      --body-bg-image: none;
      --bg-3-1-image: none;
      --bg-3-2-image: none;
      --bg-3-3-image: none;
      --bg-3-4-image: none;
      --bg-2-default-image: none;
      --bg-2-2-image: none;
      --bg-2-3-image: none;
      --bg-2-4-image: none;
      --bg-2-5-image: none;
      --bg-2-6-image: none;
      --bg-1-1-image: none;
      --bg-1-2-image: none;
      --bg-1-3-image: none;
      --bg-1-4-image: none;
      --bg-1-5-image: none;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 4600px;
      font-family: "Manrope", sans-serif;
      color: #ffffff;
      background:
        linear-gradient(rgba(2, 18, 43, 0.2), rgba(2, 18, 43, 0.2)),
        var(--body-bg-image) center top / cover repeat-y;
      overflow-x: hidden;
    }

    .parallax-bg {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    #parallax-bg-1 {
      width: 1200px;
      z-index: 1;
    }

    #parallax-bg-2 {
      width: 1200px;
      z-index: 2;
    }

    #parallax-bg-3 {
      width: 960px;
      z-index: 3;
    }

    #parallax-bg-1 div,
    #parallax-bg-2 div,
    #parallax-bg-3 div {
      position: absolute;
      display: block;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      overflow: visible;
    }

    .media-slot::before {
      content: attr(data-label);
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      color: #ffffff;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-shadow: var(--text-shadow);
    }

    .layer-note {
      display: inline-block;
      margin: 0;
      color: var(--accent-2);
      font-size: clamp(1rem, 1.8vw, 1.55rem);
      font-weight: bold;
      line-height: 1.3;
      text-shadow: var(--text-shadow);
    }

    #bg-3-1 {
      width: 520px;
      height: 520px;
      top: -20px;
      right: 40px;
      background-image: var(--bg-3-1-image);
    }

    #bg-3-2 {
      width: 520px;
      height: 520px;
      top: 1050px;
      right: 30px;
      background-image: var(--bg-3-2-image);
    }

    #bg-3-3 {
      width: 760px;
      height: 620px;
      top: 1820px;
      right: 60px;
      background-image: var(--bg-3-3-image);
    }

    #bg-3-3 .layer-note {
      margin-top: 500px;
      margin-left: 70px;
    }

    #bg-3-4 {
      width: 900px;
      height: 680px;
      top: 2860px;
      right: -20px;
      background-image: var(--bg-3-4-image);
    }

    #bg-3-4 .layer-note {
      margin-top: 560px;
      margin-left: 40px;
    }

    #parallax-bg-2 div {
      width: 330px;
      height: 330px;
    }

    #bg-2-1 {
      top: 130px;
      left: -180px;
      background-image: var(--bg-2-default-image);
    }

    #bg-2-2 {
      top: 320px;
      right: -40px;
      background-image: var(--bg-2-2-image);
    }

    #bg-2-3 {
      top: 920px;
      left: -180px;
      background-image: var(--bg-2-3-image);
    }

    #bg-2-4 {
      top: 1220px;
      right: -110px;
      background-image: var(--bg-2-4-image);
    }

    #bg-2-5 {
      top: 1650px;
      left: 130px;
      background-image: var(--bg-2-5-image);
    }

    #bg-2-5 .layer-note {
      margin-top: 250px;
      margin-left: 40px;
      font-size: 1rem;
    }

    #bg-2-6 {
      top: 760px;
      left: 360px;
      background-image: var(--bg-2-6-image);
    }

    #bg-2-6 .layer-note {
      margin-top: 250px;
      margin-left: 30px;
      font-size: 1rem;
    }

    #parallax-bg-1 div {
      width: 360px;
      height: 360px;
    }

    #bg-1-1 {
      top: 180px;
      right: 230px;
      background-image: var(--bg-1-1-image);
    }

    #bg-1-2 {
      top: 460px;
      left: 0;
      background-image: var(--bg-1-2-image);
    }

    #bg-1-3 {
      top: 920px;
      right: -120px;
      background-image: var(--bg-1-3-image);
    }

    #bg-1-4 {
      top: 1380px;
      left: 220px;
      width: 420px;
      height: 420px;
      background-image: var(--bg-1-4-image);
    }

    #bg-1-4 .layer-note {
      margin-top: 270px;
      margin-left: 10px;
      color: #ffdf80;
    }

    #bg-1-5 {
      top: 1240px;
      left: -150px;
      background-image: var(--bg-1-5-image);
    }

    .falling-object {
      position: fixed;
      top: -180px;
      z-index: 8;
      pointer-events: none;
    }

    .falling-object img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .falling-object::before {
      content: attr(data-label);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-shadow: var(--text-shadow);
    }

    .falling-racket {
      left: 10%;
      width: 170px;
      height: 260px;
      animation: falling-racket 5s linear infinite;
    }

    .falling-ball {
      left: 48%;
      width: 150px;
      height: 150px;
      animation: falling-ball 6.5s linear infinite;
      animation-delay: 1s;
    }

    .falling-cup {
      right: 8%;
      width: 170px;
      height: 220px;
      animation: falling-cup 7.5s linear infinite;
      animation-delay: 2s;
    }

    @keyframes falling-racket {
      0% {
        transform: translateY(-150px) rotate(-12deg);
      }
      100% {
        transform: translateY(430vh) rotate(18deg);
      }
    }

    @keyframes falling-ball {
      0% {
        transform: translateY(-120px) rotate(0deg);
      }
      100% {
        transform: translateY(420vh) rotate(360deg);
      }
    }

    @keyframes falling-cup {
      0% {
        transform: translateY(-180px) rotate(8deg);
      }
      100% {
        transform: translateY(440vh) rotate(-14deg);
      }
    }

    .spacer {
      position: relative;
      z-index: 0;
      height: 4600px;
    }

    @media (max-width: 1024px) {
      #parallax-bg-1,
      #parallax-bg-2 {
        width: 100vw;
      }

      #parallax-bg-3 {
        width: min(100vw, 960px);
      }

    }

    @media (max-width: 768px) {
      body {
        min-height: 3600px;
      }

      .falling-object {
        transform: scale(0.8);
      }

      #bg-3-1,
      #bg-3-2,
      #bg-3-3,
      #bg-3-4,
      #bg-2-1,
      #bg-2-2,
      #bg-2-3,
      #bg-2-4,
      #bg-2-5,
      #bg-2-6,
      #bg-1-1,
      #bg-1-2,
      #bg-1-3,
      #bg-1-4,
      #bg-1-5 {
        transform: scale(0.72);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <div class="falling-object falling-racket" data-label="Воланчик">
    <img id="falling-racket-img" alt="Воланчик для бадминтона">
  </div>

  <div class="parallax-bg" id="parallax-bg-3">
    <div class="media-slot" id="bg-3-1" data-label="футбольный мяч"></div>
    <div class="media-slot" id="bg-3-2" data-label="баскетбольный мяч"></div>
    <div class="media-slot" id="bg-3-3" data-label="теннисный объект">
    </div>
    <div class="media-slot" id="bg-3-4" data-label="футбольная сетка"></div>
  </div>

  <div class="parallax-bg" id="parallax-bg-2">
    <div class="media-slot" id="bg-2-1" data-label="волейбольная сетка"></div>
    <div class="media-slot" id="bg-2-2" data-label="бейсбольный мяч"></div>
    <div class="media-slot" id="bg-2-3" data-label="гольф-мяч"></div>
    <div class="media-slot" id="bg-2-4" data-label="мяч для американского футбола"></div>
    <div class="media-slot" id="bg-2-5" data-label="шлем">
    </div>
    <div class="media-slot" id="bg-2-6" data-label="мяч для настольного тенниса">
    </div>
  </div>

  <div class="falling-object falling-ball" data-label="падающие медали">
    <img id="falling-ball-img" alt="Спортивные медали">
  </div>

  <div class="falling-object falling-cup" data-label="падающая клюшка">
    <img id="falling-cup-img" alt="Клюшка для гольфа">
  </div>

  <div class="parallax-bg" id="parallax-bg-1">
    <div class="media-slot" id="bg-1-1" data-label="теннисная ракетка"></div>
    <div class="media-slot" id="bg-1-2" data-label="ракетка для пинг-понга"></div>
    <div class="media-slot" id="bg-1-3" data-label="боксёрские перчатки"></div>
    <div class="media-slot" id="bg-1-4" data-label="баскетбольное кольцо">
      <p class="layer-note">Ещё больше спорта и энергии</p>
    </div>
    <div class="media-slot" id="bg-1-5" data-label="теннисная сетка"></div>
  </div>

  <div class="spacer" aria-hidden="true"></div>

  <script>
    document.documentElement.style.setProperty("--body-bg-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/fon.png")');
    document.documentElement.style.setProperty("--bg-3-1-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/football.png")');
    document.documentElement.style.setProperty("--bg-3-2-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/basketball.png")');
    document.documentElement.style.setProperty("--bg-3-3-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/tennisball.png")');
    document.documentElement.style.setProperty("--bg-3-4-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/footballnet.png")');
    document.documentElement.style.setProperty("--bg-2-default-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/volleyballnet.png")');
    document.documentElement.style.setProperty("--bg-2-2-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/baseball.png")');
    document.documentElement.style.setProperty("--bg-2-3-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/golf.png")');
    document.documentElement.style.setProperty("--bg-2-4-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/usaball.png")');
    document.documentElement.style.setProperty("--bg-2-5-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/helmet.png")');
    document.documentElement.style.setProperty("--bg-2-6-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/pingpongball.png")');
    document.documentElement.style.setProperty("--bg-1-1-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/tennisracket.png")');
    document.documentElement.style.setProperty("--bg-1-2-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/pingpongracket.png")');
    document.documentElement.style.setProperty("--bg-1-3-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/gloves.png")');
    document.documentElement.style.setProperty("--bg-1-4-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/basketballrim.png")');
    document.documentElement.style.setProperty("--bg-1-5-image", 'url("https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/tennis%20net.png")');

    document.getElementById("falling-racket-img").src = "https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/shuttlecock.png";
    document.getElementById("falling-ball-img").src = "https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/medals.png";
    document.getElementById("falling-cup-img").src = "https://raw.githubusercontent.com/whisk0s/web-design2/refs/heads/main/prac8/assets/golf%20stick.png";

    document.addEventListener("DOMContentLoaded", function () {
      var layer1 = document.getElementById("parallax-bg-1");
      var layer2 = document.getElementById("parallax-bg-2");
      var layer3 = document.getElementById("parallax-bg-3");

      function parallaxScroll() {
        var scrolled = window.pageYOffset || document.documentElement.scrollTop;
        layer1.style.top = 0 - scrolled * 0.25 + "px";
        layer2.style.top = 0 - scrolled * 0.4 + "px";
        layer3.style.top = 0 - scrolled * 0.75 + "px";
      }

      parallaxScroll();
      window.addEventListener("scroll", parallaxScroll, { passive: true });
    });
  </script>
</body>
</html>
